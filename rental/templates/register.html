{% extends "base.html" %}

{% block title %}Register | DriveEase{% endblock %}

{% block content %}

<section class="auth-section">

    <form method="POST" class="form-card auth-card reveal">

        {% csrf_token %}

        <p class="tagline">JOIN DRIVE EASE</p>

        <h1>Create Account</h1>

        <p>Register to start booking your favourite cars.</p>

        <label for="username">Username</label>

        <input
            type="text"
            name="username"
            id="username"
            placeholder="Choose a username"
            required>

        <label for="email">Email Address</label>

        <input
            type="email"
            name="email"
            id="email"
            placeholder="Enter your email"
            required>

        <label for="password">Password</label>

        <input
            type="password"
            name="password"
            id="password"
            placeholder="Create a password"
            required>

        <button type="submit" class="btn btn-full">
            Create Account →
        </button>

        <p class="auth-link">
            Already registered?

            <a href="{% url 'login' %}">
                Login here
            </a>
        </p>

    </form>

</section>

{% endblock %}
