{% extends "base.html" %}

{% block title %}Login | DriveEase{% endblock %}

{% block content %}

<section class="auth-section">

    <form method="POST" class="form-card auth-card reveal">

        {% csrf_token %}

        <p class="tagline">WELCOME BACK</p>

        <h1>Login</h1>

        <p>Sign in to manage your car bookings.</p>

        <label for="username">Username</label>

        <input
            type="text"
            name="username"
            id="username"
            placeholder="Enter username"
            required>

        <label for="password">Password</label>

        <input
            type="password"
            name="password"
            id="password"
            placeholder="Enter password"
            required>

        <button type="submit" class="btn btn-full">
            Login →
        </button>

        <p class="auth-link">
            Don't have an account?

            <a href="{% url 'register' %}">
                Register here
            </a>
        </p>

    </form>

</section>

{% endblock %}
